<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantarion AI - Interface</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0e12;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: #4da6ff;
        }
        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .user-message {
            background-color: #1e3a8a;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background: rgba(255, 255, 255, 0.07);
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .input-area {
            padding: 15px;
            background: rgba(255, 255, 255, 0.02);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: #ffffff;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        #text-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            border-radius: 24px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }
        #text-input:focus {
            border-color: #4da6ff;
        }
        #send-btn {
            background-color: #2563eb;
        }
        #send-btn:hover {
            background-color: #1d4ed8;
        }
        #file-input {
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">QUANTARION AI CORE</div>

    <div class="chat-container" id="chat-box">
        <div class="message ai-message">नमस्ते पार्टनर! Quantarion AI सर्वर ऑनलाइन है। आप मुझसे कोडिंग, फाइनेंसियल एनालिसिस या कैमरा विज़न से जुड़ा कोई भी सवाल पूछ सकते हैं।</div>
    </div>

    <div class="input-area">
        <button class="icon-btn" onclick="document.getElementById('file-input').click()">📎</button>
        <input type="file" id="file-input" onchange="handleFileSelect(this)">
        <input type="text" id="text-input" placeholder="यहाँ टाइप करें...">
        <button class="icon-btn" id="send-btn" onclick="sendMessage()">➔</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const textInput = document.getElementById('text-input');

        function appendMessage(text, isUser) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const query = textInput.value.trim();
            if (!query) return;

            appendMessage(query, true);
            textInput.value = '';
            appendMessage("Quantarion AI सोच रहा है...", false);

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: query })
                });
                const data = await response.json();
                chatBox.lastChild.remove();
                appendMessage(data.reply, false);
            } catch (error) {
                chatBox.lastChild.remove();
                appendMessage("सर्वर कनेक्टिविटी एरर! कृपया बैकएंड को दोबारा रन करें।", false);
            }
        }

        function handleFileSelect(input) {
            if (input.files.length > 0) {
                appendMessage(`📎 फाइल अटैच की गई: ${input.files[0].name}`, true);
            }
        }

        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
